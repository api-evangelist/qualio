aid: qualio
name: Qualio
description: Qualio is an AI-powered quality management system (QMS) and compliance platform
  built for life sciences companies — medical devices, pharmaceuticals, biotech, software
  as a medical device (SaMD), cosmetics, cannabis and contract research organizations. It
  unifies document control, quality events (CAPAs, deviations, non-conformances), training
  records, design controls, risk and change management, supplier management, audits and
  compliance intelligence in one audit-ready system. Qualio exposes a RESTful Developer API
  (OpenAPI 3.1.0, base URL https://api.qualio.com) providing secure, API-key-authenticated
  programmatic access to documents, events, training, users, suppliers, design controls and
  compliance data, letting teams automate quality processes and integrate the QMS with the
  rest of their toolchain.
