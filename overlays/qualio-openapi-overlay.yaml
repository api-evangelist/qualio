overlay: 1.0.0
info:
  title: API Evangelist enhancements for Qualio Developer API
  version: 1.0.0
extends: openapi/qualio-openapi.json
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: '2026-07-20'
      x-apievangelist-provider: qualio
      x-apievangelist-auth: api-key (X-Api-Key header)
      x-apievangelist-base-url: https://api.qualio.com
  - target: $.info
    update:
      x-apievangelist-conventions:
        pagination: offset/limit
        rate_limit_signal: HTTP 429
        idempotency: unsupported
        error_format: application/json (not RFC 9457)
      x-apievangelist-compliance: [ISO 9001, ISO 27001, ISO 27701]
      x-apievangelist-status-page: https://status.qualio.com
