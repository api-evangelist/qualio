                  type: object
                  properties:
                    id:
                      type: number
                    filename:
                      type: string
                  required:
                  - id
                  - filename
                  additionalProperties: false
                description: Attachments referenced within this section's content. Use `GET /v1/documents/attachments/{id}` to retrieve an attachment's full metadata or download it.
            required:
            - content
            - position
            - title
            - attachments
            additionalProperties: false
      required:
      - sections
      additionalProperties: false
      description: The content of a particular Qualio document version
      example:
        sections:
        - title: Introduction
          position: 1
          content: <p>At Acme Medical Software, we recognize that the security of our software systems is critical to ensuring the safety, privacy, and trust of patients, healthcare providers, and regulatory stakeholders.</p>
          attachments: []
        - title: Purpose
          position: 2
          content: <p>The purpose of this Security Policy is to:</p><ul><li><strong>Establish a systematic security approach</strong> for protecting our systems and data</li><li><strong>Define roles and responsibilities</strong> for security across the organization</li><li><strong>Ensure compliance</strong> with applicable standards and regulatory requirements</li></ul>
          attachments: []
        - title: Policy
          position: 3
          content: <h3>1. Scope</h3><p>This policy applies to all employees, contractors, and systems handling company or customer data.</p><h3>2. Access Control</h3><p>Access to systems shall be granted on a least-privilege basis and reviewed quarterly.</p>
          attachments:
          - id: 1
            filename: Policy.docx
