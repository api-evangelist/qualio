      example: 1
    updateDocumentContentPayload:
      type: object
      properties:
        sections:
          type: array
          items:
            type: object
            properties:
              position:
                type: number
                description: The 1-indexed position of the section within the document, as defined by the document template. Sections not included in the request are left unchanged.
                example: 1
              content:
                type: string
                description: The new HTML content for the section. Must be valid HTML. Plain text is also accepted and will be stored as-is.
                example: <p>Updated section content.</p>
            required:
            - position
            - content
          description: A list of sections to update, identified by position. Only the sections included here are modified; all other sections retain their existing content. To update all sections, include every section position defined by the document template.
      required:
      - sections
      description: A partial update to the HTML section content of a draft document. Only sections included in the request are modified; all other sections retain their existing content.
      example:
        sections:
        - position: 1
          content: <p>At Acme Medical Software, we recognize that the security of our software systems is critical to ensuring the safety, privacy, and trust of patients and regulatory stakeholders.</p>
    documentContentResponse:
      type: object
      properties:
        sections:
          type: array
          items:
            type: object
