components:
  schemas:
    me:
      type: object
      properties:
        user_id:
          type: number
        full_name:
          type: string
      required:
      - user_id
      - full_name
      additionalProperties: false
      description: Retrieve the current user's id and name
      example:
        user_id: 1
        full_name: John Doe
    user:
      type: object
      properties:
        user_id:
          type: number
        email:
          type: string
        full_name:
          type: string
        invite_status:
          type: string
          enum:
          - pending
          - accepted
          - declined
          - canceled
        role:
          type: string
          enum:
          - quality
          - normal
          - basic
        is_admin:
          type: boolean
      required:
      - user_id
      - email
      - full_name
      - invite_status
      - role
      - is_admin
      additionalProperties: false
      description: A Qualio user
      example:
        user_id: 1
        email: testuser1@example.com
        full_name: John Doe
        invite_status: pending
        role: quality
        is_admin: false
    generic404:
      anyOf:
      - type: object
        properties: {}
        additionalProperties: false
      - type: 'null'
      description: A generic response when a resource can't be found
      example: {}
    userList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: number
              email:
                type: string
              full_name:
                type: string
              invite_status:
                type: string
                enum:
                - pending
                - accepted
                - declined
                - canceled
              role:
                type: string
                enum:
                - quality
                - normal
                - basic
              is_admin:
                type: boolean
            required:
            - user_id
            - email
            - full_name
            - invite_status
            - role
            - is_admin
            additionalProperties: false
        total:
          type: number
      required:
      - items
      - total
      additionalProperties: false
      description: An array of Qualio users
      example:
        items:
        - user_id: 1
          email: testuser1@example.com
          full_name: John Doe
          invite_status: pending
          role: quality
          is_admin: false
        total: 1
    reassignmentRequest:
      type: object
      properties:
        destination_user_id:
          type: number
        reassignments:
          type: object
          properties:
            document_owner:
              type: array
              items:
                type: number
            document_reviewer:
              type: array
              items:
                type: number
            document_approver:
              type: array
              items:
                type: number
            event_owner:
              type: array
              items:
                type: number
            event_template_owner:
              type: array
              items:
                type: number
            event_template_default_owner:
              type: array
              items:
                type: number
            change_request_owner:
              type: array
              items:
                type: number
            task_owner:
              type: array
              items:
                type: number
            doc_template_owner:
              type: array
              items:
                type: number
      required:
      - destination_user_id
      - reassignments
      description: A request to reassign all entities from one user to another
      example:
        destination_user_id: 67890
        reassignments:
          document_owner:
          - 101
          - 102
          event_owner:
          - 103
    groupId:
      type: number
      description: A unique identifier for a group in Qualio
      example: 1
    groupList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              group_id:
                type: number
              name:
                type: string
            required:
            - group_id
            - name
            additionalProperties: false
        total:
          type: number
      required:
      - items
      - total
      additionalProperties: false
      description: An array of groups within your Qualio instance
      example:
        items:
        - group_id: 1
          name: Quality Team
        - group_id: 2
          name: Engineering Team
        total: 1
    reassignmentResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
      additionalProperties: false
      description: A response confirming the reassignment was successful
      example:
        message: User reassignments updated
    userGroupResp:
      type: object
      properties:
        message:
          type: string
      required:
      - message
      additionalProperties: false
      description: A message confirming the user group addition was successful
      example:
        message: User added to group
    userId:
      type: number
      description: A unique identifier for a user in Qualio
      example: 12345
    genericForbiddenResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
      additionalProperties: false
      example:
        message: User is not authorized to access this resource with an explicit deny
    userGroupRemoveResp:
      type: object
      properties:
        message:
          type: string
      required:
      - message
      additionalProperties: false
      description: A message confirming the user group removal was successful
      example:
        message: User removed from group
    throttledResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
      additionalProperties: false
      example:
        message: You have exceeded what is allowed in the fair use policy for this API
    genericBadRequest400PathResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              location:
                type: string
              name:
                type: string
            required:
            - description
            additionalProperties: false
        status:
          type: string
          const: error
      required:
      - errors
      - status
      additionalProperties: false
      example:
        status: error
        errors:
        - location: path
          name: user_id
          description: user_id is not an integer
    deleteUserResp:
      type: object
      properties:
        message:
          type: string
      required:
      - message
      additionalProperties: false
      description: A message indicating the user has been removed
      example:
        message: User removed successfully
    userHasAssignmentsError:
      type: object
      properties:
        message:
          type: string
        slug:
          type: string
          const: user_has_assignments
        assignments:
          type: object
          properties:
            document_owner:
              type: array
              items:
                type: number
            document_reviewer:
              type: array
              items:
                type: number
            document_approver:
              type: array
              items:
                type: number
            event_owner:
              type: array
              items:
                type: number
            event_template_owner:
              type: array
              items:
                type: number
            event_template_default_owner:
              type: array
              items:
                type: number
            change_request_owner:
              type: array
              items:
                type: number
            task_owner:
              type: array
              items:
                type: number
            doc_template_owner:
              type: array
              items:
                type: number
          additionalProperties: false
      required:
      - message
      - slug
      - assignments
      additionalProperties: false
      description: A message indicating the user has assignments remaining that must be reassigned before removal
      example:
        message: User has assignments remaining that must be reassigned before removal
        slug: user_has_assignments
        assignments:
          document_owner:
          - 101
          - 102
          - 103
          document_reviewer:
          - 201
          - 202
          document_approver:
          - 301
          event_owner:
          - 401
          - 402
          task_owner:
          - 501
    genericBadRequestResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              location:
                type: string
              name:
                type: string
            required:
            - description
            additionalProperties: false
        status:
          type: string
          const: error
      required:
      - errors
      - status
      additionalProperties: false
      example:
        status: error
        errors:
        - location: body
          name: email
          description: Email missing from payload
    userAssignmentMapping:
      type: object
      properties:
        document_owner:
          type: array
          items:
            type: number
        document_reviewer:
          type: array
          items:
            type: number
        document_approver:
          type: array
          items:
            type: number
        event_owner:
          type: array
          items:
            type: number
        event_template_owner:
          type: array
          items:
            type: number
        event_template_default_owner:
          type: array
          items:
            type: number
        change_request_owner:
          type: array
          items:
            type: number
        task_owner:
          type: array
          items:
            type: number
        doc_template_owner:
          type: array
          items:
            type: number
      additionalProperties: false
      description: A response containing all entity assignments for a specific user
      example:
        document_owner:
        - 101
        - 102
        - 103
        document_reviewer:
        - 201
        - 202
        document_approver:
        - 301
        event_owner:
        - 401
        - 402
        task_owner:
        - 501
    invite:
      type: object
      properties:
        email:
          type: string
        role:
          type: string
          enum:
          - quality
          - normal
          - basic
        can_access_billing:
          type: boolean
        is_admin:
          type: boolean
      required:
      - email
      - role
      description: An invite for a user to join your Qualio instance
      example:
        email: testuser1@example.com
        role: quality
        is_admin: false
        can_access_billing: false
  securitySchemes:
    api_key:
      type: apiKey
      name: X-Api-Key
      in: header
