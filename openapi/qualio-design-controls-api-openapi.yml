    options:
      description: Create a risk in a design control product. Set subType to iso for ISO 14971 qualitative risk analysis or fmea for Failure Mode and Effects Analysis. An optional id may be provided for idempotency; when omitted the server generates one automatically. A short code is always auto-generated by the server. ISO risks accept hazard, foreseeableUseMisuse, hazardSituation, and harm fields, with string-based preMitigation and postMitigation assessments. FMEA risks accept failureMode, failureModeEffects, failureCauses, and evaluationMethod fields, with numeric preMitigation and postMitigation scores (1 to 10). postMitigation requires riskControl to be provided. Use sources for upstream items this risk stems from and mitigations for downstream items that mitigate this risk. Providing an id that already exists in the product returns 409 Conflict.
      operationId: createProductRiskOptions
      tags:
      - Design Controls
      x-scalar-ignore: true
      parameters:
      - in: path
        name: productId
        schema:
          $ref: '#/components/schemas/dcProductId'
        required: true
        description: A design control product id
      responses:
        '200':
          description: Options 200
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
  /v1/design-controls/products/{productId}/risks/{riskId}:
    put:
      summary: Update a risk
      description: 'Update an existing risk in a design control product. The subType field must match the existing subType of the risk; changing the subType is not supported and returns 400. The request body replaces the mutable fields of the risk: title, subType, description, and all sub-type-specific assessment and narrative fields. The sources and mitigations fields define the complete desired set of trace links and replace all existing trace links when provided. Omitting both leaves existing trace links unchanged. The id and code of the risk are immutable and cannot be changed by this endpoint.'
      operationId: updateProductRisk
      tags:
      - Design Controls
      security:
      - api_key: []
      parameters:
      - in: path
        name: productId
        schema:
          $ref: '#/components/schemas/dcProductId'
        required: true
        description: A design control product id
      - in: path
        name: riskId
        schema:
          $ref: '#/components/schemas/riskId'
        required: true
        description: The unique identifier of the risk to update. This is the id returned when the risk was created.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: The title of the risk, displayed in the Qualio UI. Must be between 1 and 255 characters.
                description:
                  description: An optional description of the risk. Accepts plain text.
                  type: string
                riskControl:
                  type: object
                  properties:
                    mitigation:
                      type: string
                      minLength: 1
                      description: A description of the control measure applied to reduce or eliminate the risk.
                  required:
                  - mitigation
                  description: The risk control measure. Required before a post-mitigation assessment can be recorded.
                sources:
                  description: An array of quality item codes or UUIDs that are the upstream sources of this risk, for example requirement codes. Codes or UUIDs not found in the product are stored as unresolved links and resolved automatically when the target item is created.
                  type: array
                  items:
                    type: string
                mitigations:
                  description: An array of quality item codes or UUIDs for items that mitigate this risk downstream, for example requirement or test case codes. Codes or UUIDs not found in the product are stored as unresolved links and resolved automatically when the target item is created.
                  type: array
                  items:
                    type: string
                subType:
                  type: string
                  enum:
                  - iso
                  - fmea
                  description: The risk assessment methodology. Must match the existing subType of the risk; changing the subType is not supported and returns 400. iso uses probability and severity string scales; fmea uses numeric severity, occurrence, and detectability scores (1 to 10).
                hazard:
                  description: The hazard associated with this risk. Only applicable when subType is iso. Max 1000 characters.
                  type: string
                  maxLength: 1000
                foreseeableUseMisuse:
                  description: The reasonably foreseeable use or misuse scenario. Only applicable when subType is iso. Max 1000 characters.
                  type: string
                  maxLength: 1000
                hazardSituation:
                  description: The hazardous situation resulting from the hazard. Only applicable when subType is iso. Max 1000 characters.
                  type: string
                  maxLength: 1000
                harm:
                  description: The harm that could result from the hazardous situation. Only applicable when subType is iso. Max 1000 characters.
                  type: string
                  maxLength: 1000
                failureMode:
                  description: A description of the way in which a component or process could fail. Only applicable when subType is fmea. Max 1000 characters.
                  type: string
                  maxLength: 1000
                failureModeEffects:
                  description: The effects of the failure mode on the system or end user. Only applicable when subType is fmea. Max 1000 characters.
                  type: string
                  maxLength: 1000
                failureCauses:
                  description: The root causes that lead to the failure mode. Only applicable when subType is fmea. Max 1000 characters.
                  type: string
                  maxLength: 1000
                evaluationMethod:
                  description: Current controls or evaluation methods in place to detect the failure mode. Only applicable when subType is fmea. Max 1000 characters.
                  type: string
                  maxLength: 1000
                preMitigation:
                  description: 'Pre-mitigation assessment. For iso risks: an object with probability (string), severity (string), and optionally riskLevel (string). For fmea risks: an object with severity, occurrence, and detectability as positive integers (1 to 10).'
                  anyOf:
                  - type: object
                    properties:
                      probability:
                        type: string
                        minLength: 1
                        description: A qualitative or quantitative label for the probability of occurrence, taken from the probability scale configured in the product.
                      severity:
                        type: string
                        minLength: 1
                        description: A qualitative or quantitative label for the severity of harm, taken from the severity scale configured in the product.
                      riskLevel:
                        description: The overall risk level derived from probability and severity. When omitted the server calculates it from the configured risk matrix.
                        type: string
                    required:
                    - probability
                    - severity
                  - type: object
                    properties:
                      severity:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                        description: Severity score from 1 to 10 representing the impact of the failure mode.
                      occurrence:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                        description: Occurrence score from 1 to 10 representing the likelihood that the failure mode will occur.
                      detectability:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                        description: Detectability score from 1 to 10 representing the likelihood that the failure mode will be detected before reaching the end user. Lower values mean higher detectability.
                    required:
                    - severity
                    - occurrence
                    - detectability
                postMitigation:
                  description: Post-mitigation assessment after the risk control is applied. Shape is identical to preMitigation for the given subType. Requires riskControl to be set.
                  anyOf:
                  - type: object
                    properties:
                      probability:
                        type: string
                        minLength: 1
                        description: A qualitative or quantitative label for the probability of occurrence, taken from the probability scale configured in the product.
                      severity:
                        type: string
                        minLength: 1
                        description: A qualitative or quantitative label for the severity of harm, taken from the severity scale configured in the product.
                      riskLevel:
                        description: The overall risk level derived from probability and severity. When omitted the server calculates it from the configured risk matrix.
                        type: string
                    required:
                    - probability
                    - severity
                  - type: object
                    properties:
                      severity:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                        description: Severity score from 1 to 10 representing the impact of the failure mode.
                      occurrence:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                        description: Occurrence score from 1 to 10 representing the likelihood that the failure mode will occur.
                      detectability:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                        description: Detectability score from 1 to 10 representing the likelihood that the failure mode will be detected before reaching the end user. Lower values mean higher detectability.
                    required:
                    - severity
                    - occurrence
                    - detectability
              required:
              - title
              - subType
              description: A request body to update an existing risk in a design control product. The subType field must match the existing subType of the risk; changing the subType is not supported and returns 400. The sources and mitigations fields define the complete desired set of trace links and replace all existing trace links when provided. Omitting both leaves existing trace links unchanged. The id and code of the risk are immutable and cannot be changed by this endpoint.
              example:
                title: Risk of pump over-pressurisation causing patient harm (revised)
                subType: iso
                hazard: Mechanical failure of pressure regulation valve
                hazardSituation: Pump delivers pressure above rated maximum during infusion
                harm: Patient trauma due to over-pressurisation
                preMitigation:
                  probability: Occasional
                  severity: Critical
                  riskLevel: High
                riskControl:
                  mitigation: Add a secondary pressure relief valve and software interlock
                postMitigation:
                  probability: Remote
                  severity: Critical
                  riskLevel: Low
                mitigations:
                - REQ-5
                - REQ-12
                - TC-1
              ref: updateRisk
      responses:
        '200':
          description: Risk updated successfully.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: The unique identifier of the created item.
                  title:
                    type: string
                    description: The title of the item.
                  code:
                    description: The short identifier visible in the Qualio UI.
                    type: string
                  description:
                    description: The content of the object
                    type: string
                  source:
                    type: string
                    description: The system associated with this item. Set at creation time from the source field in the request, defaulting to developer-api. This value is immutable after creation.
                  source_url:
                    description: The URL linking back to the corresponding entry in the source system. Reflects the url field from the request.
                    type: string
                    format: uri
                  created_at:
                    type: string
                    format: date-time
                    description: An ISO 8601 timestamp recording when the item was created.
                  updated_at:
                    type: string
                    format: date-time
                    description: An ISO 8601 timestamp recording when the item was last modified.
                  issues:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties:
                      type: boolean
                    description: A map of policy violation flags. Keys are policy statement identifiers such as REQUIRES_CHILD, UNTESTED_REQUIREMENT, or FAILING_TEST. Newly created items have no active violations and this object is empty.
                  type:
                    type: string
                    const: risk
                    description: The quality item category. Always risk for items created by this endpoint.
                  subType:
                    type: string
                    enum:
                    - iso
                    - fmea
                    description: 'The risk assessment methodology used for this risk: iso or fmea.'
                  riskControl:
                    type: object
                    properties:
                      mitigation:
                        type: string
                        minLength: 1
                        description: A description of the control measure applied to reduce or eliminate the risk.
                    required:
                    - mitigation
                    additionalProperties: false
                    description: The risk control measure. Required before a post-mitigation assessment can be recorded.
                  hazard:
                    description: The hazard. Present when subType is iso.
                    type: string
                  foreseeableUseMisuse:
                    description: The foreseeable use or misuse scenario. Present when subType is iso.
                    type: string
                  hazardSituation:
                    description: The hazardous situation. Present when subType is iso.
                    type: string
                  harm:
                    description: The harm that could result. Present when subType is iso.
                    type: string
                  failureMode:
                    description: The failure mode description. Present when subType is fmea.
                    type: string
                  failureModeEffects:
                    description: The effects of the failure mode. Present when subType is fmea.
                    type: string
                  failureCauses:
                    description: The root causes of the failure mode. Present when subType is fmea.
                    type: string
                  evaluationMethod:
                    description: Current controls or evaluation methods. Present when subType is fmea.
                    type: string
                  preMitigation:
                    description: Pre-mitigation assessment. For iso risks contains probability, severity, and optionally riskLevel strings. For fmea risks contains numeric severity, occurrence, and detectability scores.
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties:
                      anyOf:
                      - type: string
                      - type: number
                  postMitigation:
                    description: Post-mitigation assessment after the risk control is applied. Shape is the same as preMitigation for the given subType.
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties:
                      anyOf:
                      - type: string
                      - type: number
                required:
                - id
                - title
                - source
                - created_at
                - updated_at
                - issues
                - type
                - subType
                additionalProperties: false
                description: The risk after the update was applied.
                example:
                  id: a1c3e5f7-2b4d-4068-9a8c-1d2e3f405162
                  title: Risk of pump over-pressurisation causing patient harm
                  code: RISK-1
                  type: risk
                  subType: iso
                  source: developer-api
                  created_at: '2026-05-22T09:00:00.000Z'
                  updated_at: '2026-05-22T09:00:00.000Z'
                  issues: {}
                  hazard: Mechanical failure of pressure regulation valve
                  hazardSituation: Pump delivers pressure above rated maximum during infusion
                  harm: Patient trauma due to over-pressurisation
                  riskControl:
                    mitigation: Add a secondary pressure relief valve rated at 110% of maximum operating pressure
                  preMitigation:
                    probability: Occasional
                    severity: Critical
                    riskLevel: High
                  postMitigation:
                    probability: Remote
                    severity: Critical
                    riskLevel: Medium
                ref: updatedRisk
