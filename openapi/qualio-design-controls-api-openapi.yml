    post:
      summary: Create a requirement
      description: 'Create a requirement in a design control product. A requirement describes a condition or capability the product must satisfy. The type field identifies which requirement template slot to use: req1, req2, req3, and req4 map to the first, second, third, and fourth configured templates respectively. A code is generated automatically when none is supplied. Use the links, requirements, or test_cases fields to add traceability connections to existing quality items by providing their codes or UUIDs. Type-matching is enforced: req1 can only link to testCase1 items, req2 to testCase2, and req3 to testCase3. req4 requirements cannot link to any test case type. Mismatched types return 400. Codes or UUIDs not found in the product are stored as unresolved links and resolved automatically when the target item is created. Providing an id that already exists in the product returns 409 Conflict.'
      operationId: createProductRequirement
      tags:
      - Design Controls
      security:
      - api_key: []
      parameters:
      - in: path
        name: productId
        schema:
          $ref: '#/components/schemas/dcProductId'
        required: true
        description: A design control product id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: The title of the item, displayed in the Qualio UI. Must be between 1 and 255 characters.
                description:
                  description: An optional description of the item. Accepts plain text up to 150,000 characters.
                  type: string
                  maxLength: 150000
                links:
                  description: 'An array of quality item codes or UUIDs to establish as trace links. You may supply codes (such as REQ-1 or TC-5) or UUIDs. If a supplied value is not found in the product, it is stored as an unresolved link and resolved automatically when the target item is created later. Type-matching rules apply: see the notes on test_cases for requirements and on the type field for test cases.'
                  type: array
                  items:
                    type: string
                requirements:
                  description: An array of requirement codes or UUIDs to link for traceability coverage. Entries are combined with links and test_cases and processed together. The same type-matching rules apply.
                  type: array
                  items:
                    type: string
                type:
                  type: string
                  enum:
                  - req1
                  - req2
                  - req3
                  - req4
                  description: 'The requirement template slot to use for this item. Qualio products support up to four requirement templates; req1, req2, req3, and req4 correspond to the first, second, third, and fourth configured templates. Check your product configuration in Qualio to determine which value to supply. The type also governs which test cases this requirement can be linked to: req1 can only be linked to testCase1 items, req2 to testCase2, and req3 to testCase3. req4 requirements cannot be directly linked to any test case type. Attempting to link incompatible types returns 400.'
                test_cases:
                  description: 'An array of test case codes or UUIDs to link to this requirement, establishing coverage traceability. The test case template number must match the requirement template number: a req1 requirement can only link to testCase1 items, req2 to testCase2, and req3 to testCase3. Supplying a test case whose type does not match returns 400. If a supplied code or UUID is not found in the product, it is stored as an unresolved link and resolved automatically when the target item is created. Entries are combined with links and requirements and processed together.'
                  type: array
                  items:
                    type: string
              required:
              - title
              - type
              description: A request body to create a new requirement in a design control product. Supply a title and a type to identify the requirement template slot to use. An optional id may be provided to assign a specific identifier; when omitted the server generates one automatically. A short code is always auto-generated by the server from the product type configuration counter. Use links, requirements, and test_cases to establish traceability connections to existing quality items by supplying their codes or UUIDs. Supplying an id that already belongs to an existing requirement in this product returns 409 Conflict.
              example:
                title: Pump pressure must remain within safe operating range
                type: req1
                description: The pump shall maintain output pressure between 0.5 bar and 4.0 bar under all rated operating conditions.
                test_cases:
                - TC-1
                - TC-3
              ref: createRequirement
      responses:
        '201':
          description: Requirement created successfully.
          headers:
            Access-Control-Allow-Origin:
              schema:
