  /v1/design-controls/products/{productId}/risks:
    post:
      summary: Create a risk
      description: Create a risk in a design control product. Set subType to iso for ISO 14971 qualitative risk analysis or fmea for Failure Mode and Effects Analysis. An optional id may be provided for idempotency; when omitted the server generates one automatically. A short code is always auto-generated by the server. ISO risks accept hazard, foreseeableUseMisuse, hazardSituation, and harm fields, with string-based preMitigation and postMitigation assessments. FMEA risks accept failureMode, failureModeEffects, failureCauses, and evaluationMethod fields, with numeric preMitigation and postMitigation scores (1 to 10). postMitigation requires riskControl to be provided. Use sources for upstream items this risk stems from and mitigations for downstream items that mitigate this risk. Providing an id that already exists in the product returns 409 Conflict.
      operationId: createProductRisk
      tags:
      - Design Controls
      security:
      - api_key: []
      parameters:
      - in: path
        name: productId
        schema:
          $ref: '#/components/schemas/dcProductId'
        required: true
        description: A design control product id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: The title of the risk, displayed in the Qualio UI. Must be between 1 and 255 characters.
                description:
                  description: An optional description of the risk. Accepts plain text.
                  type: string
                riskControl:
                  type: object
                  properties:
                    mitigation:
                      type: string
                      minLength: 1
                      description: A description of the control measure applied to reduce or eliminate the risk.
                  required:
                  - mitigation
                  description: The risk control measure. Required before a post-mitigation assessment can be recorded.
                sources:
                  description: An array of quality item codes or UUIDs that are the upstream sources of this risk, for example requirement codes. Codes or UUIDs not found in the product are stored as unresolved links and resolved automatically when the target item is created.
                  type: array
                  items:
                    type: string
                mitigations:
                  description: An array of quality item codes or UUIDs for items that mitigate this risk downstream, for example requirement or test case codes. Codes or UUIDs not found in the product are stored as unresolved links and resolved automatically when the target item is created.
                  type: array
                  items:
                    type: string
                subType:
                  type: string
                  enum:
                  - iso
                  - fmea
                  description: 'The risk assessment methodology. Use iso for ISO 14971 qualitative risk analysis with probability and severity string scales. Use fmea for Failure Mode and Effects Analysis with numeric severity, occurrence, and detectability scores (1 to 10). The subType determines which assessment fields apply: iso uses hazard, foreseeableUseMisuse, hazardSituation, and harm; fmea uses failureMode, failureModeEffects, failureCauses, and evaluationMethod.'
                hazard:
                  description: The hazard associated with this risk. Only applicable when subType is iso. Max 1000 characters.
                  type: string
                  maxLength: 1000
                foreseeableUseMisuse:
                  description: The reasonably foreseeable use or misuse scenario. Only applicable when subType is iso. Max 1000 characters.
                  type: string
                  maxLength: 1000
                hazardSituation:
                  description: The hazardous situation resulting from the hazard. Only applicable when subType is iso. Max 1000 characters.
                  type: string
                  maxLength: 1000
                harm:
                  description: The harm that could result from the hazardous situation. Only applicable when subType is iso. Max 1000 characters.
                  type: string
                  maxLength: 1000
                failureMode:
                  description: A description of the way in which a component or process could fail. Only applicable when subType is fmea. Max 1000 characters.
                  type: string
                  maxLength: 1000
                failureModeEffects:
                  description: The effects of the failure mode on the system or end user. Only applicable when subType is fmea. Max 1000 characters.
                  type: string
                  maxLength: 1000
                failureCauses:
                  description: The root causes that lead to the failure mode. Only applicable when subType is fmea. Max 1000 characters.
                  type: string
                  maxLength: 1000
                evaluationMethod:
                  description: Current controls or evaluation methods in place to detect the failure mode. Only applicable when subType is fmea. Max 1000 characters.
                  type: string
                  maxLength: 1000
                preMitigation:
                  description: 'Pre-mitigation assessment. For iso risks: an object with probability (string), severity (string), and optionally riskLevel (string). For fmea risks: an object with severity, occurrence, and detectability as positive integers (1 to 10).'
                  anyOf:
                  - type: object
                    properties:
                      probability:
                        type: string
                        minLength: 1
                        description: A qualitative or quantitative label for the probability of occurrence, taken from the probability scale configured in the product.
                      severity:
                        type: string
                        minLength: 1
                        description: A qualitative or quantitative label for the severity of harm, taken from the severity scale configured in the product.
                      riskLevel:
                        description: The overall risk level derived from probability and severity. When omitted the server calculates it from the configured risk matrix.
                        type: string
                    required:
                    - probability
                    - severity
                  - type: object
                    properties:
                      severity:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                        description: Severity score from 1 to 10 representing the impact of the failure mode.
                      occurrence:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                        description: Occurrence score from 1 to 10 representing the likelihood that the failure mode will occur.
                      detectability:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                        description: Detectability score from 1 to 10 representing the likelihood that the failure mode will be detected before reaching the end user. Lower values mean higher detectability.
                    required:
                    - severity
                    - occurrence
                    - detectability
                postMitigation:
                  description: Post-mitigation assessment after the risk control is applied. Shape is identical to preMitigation for the given subType. Requires riskControl to be set.
                  anyOf:
                  - type: object
                    properties:
                      probability:
                        type: string
                        minLength: 1
                        description: A qualitative or quantitative label for the probability of occurrence, taken from the probability scale configured in the product.
                      severity:
                        type: string
                        minLength: 1
                        description: A qualitative or quantitative label for the severity of harm, taken from the severity scale configured in the product.
                      riskLevel:
                        description: The overall risk level derived from probability and severity. When omitted the server calculates it from the configured risk matrix.
                        type: string
                    required:
                    - probability
                    - severity
                  - type: object
                    properties:
                      severity:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                        description: Severity score from 1 to 10 representing the impact of the failure mode.
                      occurrence:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                        description: Occurrence score from 1 to 10 representing the likelihood that the failure mode will occur.
                      detectability:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                        description: Detectability score from 1 to 10 representing the likelihood that the failure mode will be detected before reaching the end user. Lower values mean higher detectability.
                    required:
                    - severity
                    - occurrence
                    - detectability
              required:
              - title
              - subType
              description: 'A request body to create a new risk in a design control product. The subType field selects the risk assessment methodology: iso for ISO 14971 qualitative risk analysis, fmea for Failure Mode and Effects Analysis. An optional id may be provided to assign a specific identifier; when omitted the server generates one automatically. A short code is always auto-generated by the server. ISO risks support hazard, foreseeableUseMisuse, hazardSituation, harm, and string-based preMitigation and postMitigation assessments. FMEA risks support failureMode, failureModeEffects, failureCauses, evaluationMethod, and numeric preMitigation and postMitigation assessments (scores 1 to 10). postMitigation requires riskControl to be provided. Use sources to link items this risk stems from (upstream) and mitigations to link items that mitigate this risk (downstream). Supplying an id that already exists in this product returns 409 Conflict.'
              example:
                title: Risk of pump over-pressurisation causing patient harm
                subType: iso
                description: If the pump delivers pressure above the rated maximum, the patient may be harmed.
                hazard: Mechanical failure of pressure regulation valve
                hazardSituation: Pump delivers pressure above rated maximum during infusion
                harm: Patient trauma due to over-pressurisation
