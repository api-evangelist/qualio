        required: true
        description: A unique identifier for a supplier
      responses:
        '200':
          description: Options 200
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
      summary: List supplier audits options
      x-summary-source: derived
components:
  schemas:
    supplier:
      type: object
      properties:
        name:
          type: string
        contact_information:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            phone:
              type: string
            address:
              type: string
            website:
              type: string
            notes:
              type: string
          additionalProperties: false
        intended_use:
          type: string
        sponsor_user_id:
          type: number
        supplier_id:
          type: string
        archived:
          type: boolean
        status:
          type: string
          enum:
          - REVIEW_PENDING
          - APPROVED
          - REJECTED
          - DRAFT
          - ARCHIVED
        created_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
        approved_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        due_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        risk_type:
          type: object
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
            description:
              type: string
            periodic_review:
              type: number
          additionalProperties: false
        approvers:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: number
              full_name:
                type: string
              email:
                type: string
            required:
            - user_id
            - full_name
            - email
            additionalProperties: false
      required:
      - name
      - supplier_id
      - archived
      - status
      - created_at
      - modified_at
      - approved_at
      - due_at
      - approvers
      additionalProperties: false
      description: A supplier
      example:
        name: Acme
        contact_information:
          name: Mr Acme
          email: info@acme.com
          address: 1 Acme st, Acme, NY
          notes: Call in emergency only
          phone: 555-1234-345
        intended_use: Chemical reagents only
        sponsor_user_id: 999
        archived: false
        status: APPROVED
        created_at: '2020-01-01T00:00:00Z'
        modified_at: '2020-01-01T00:00:00Z'
        approved_at: '2020-03-01T00:00:00Z'
        due_at: '2021-01-01T00:00:00Z'
        supplier_id: asdf-asdasd-asdas-adss
        risk_type:
          id: 458bf34c-8ee1-475f-8c4c-ae735518991a
          title: Risk 1
          description: Risk 1 description
          periodic_review: 1
        approvers:
        - user_id: 999
          full_name: Mr Acme
          email: info@acme.com
    supplierAuditsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              audit_id:
                type: string
              supplier_id:
                type: string
              name:
                type: string
              status:
                type: string
                enum:
                - PLANNED
                - ONGOING
                - DONE
              audit_type:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  description:
                    type: string
                  periodic_review:
                    type: number
                additionalProperties: false
              notes:
                type: string
              start_date:
                type: string
              end_date:
                type: string
              created_by:
                type: string
              created_at:
                type: string
                format: date-time
              modified_at:
                type: string
                format: date-time
              documents:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                    file:
                      type: object
                      properties:
                        file_name:
                          type: string
                        description:
                          type: string
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                          - FILE
                          - QUALIO_DOC
                      required:
                      - id
                      - type
                      additionalProperties: false
                  required:
                  - file
                  additionalProperties: false
            required:
            - audit_id
            - supplier_id
            - name
            - status
            additionalProperties: false
      required:
      - items
      additionalProperties: false
      description: An array of a supplier's audits
      example:
        items:
        - audit_id: 1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
          supplier_id: asdf-asdasd-asdas-adss
          name: 2024 On-site Audit
          status: DONE
          audit_type:
            id: c9c2302f-bf0d-4e50-81f6-ccc78f0c5a58
            title: On-site
            description: On-site supplier audit
            periodic_review: 12
          notes: No major findings.
          start_date: '2024-05-01T09:00:00Z'
          end_date: '2024-05-02T17:00:00Z'
          created_by: Jane Auditor
          created_at: '2024-05-01T09:00:00Z'
          modified_at: '2024-05-02T17:00:00Z'
          documents:
          - id: 458bf34c-8ee1-475f-8c4c-ae735518991a
            title: Audit report
            description: Signed audit report
            file:
              file_name: audit-report.pdf
              description: Signed audit report
              id: a3f5c2d1-0e4b-4c8a-9f2d-6b7e8c9a0d1e
              type: FILE
    createSupplier:
      type: object
      properties:
        name:
          type: string
        contact_information:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            phone:
              type: string
            address:
              type: string
            website:
              type: string
            notes:
              type: string
        intended_use:
          type: string
        sponsor_user_id:
