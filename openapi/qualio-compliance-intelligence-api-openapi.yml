  /v1/compliance/controls:
    get:
      summary: List controls
      description: 'Lists the compliance controls in your Qualio instance. A control is a measure your organisation implements to satisfy one or more compliance requirements. Controls are either Qualio-managed (built-in, with a QMC- code prefix) or created by your organisation (with a C- code prefix). Each control carries an implementation status: ready (implemented and effective), not_ready (in progress), not_applicable (does not apply to your instance), or not_started (work has not begun). Use the framework_id parameter to return only controls linked to requirements of a specific framework, and the status parameter to return only controls in a particular state. Omit either parameter to apply no filter on that dimension. Results are ordered by control id. Use offset and limit to page through large sets; the total field in the response reports the full count of matching controls before pagination is applied.'
      operationId: listComplianceControls
      tags:
      - Compliance Intelligence
      security:
      - api_key: []
      parameters:
      - in: query
        name: framework_id
        schema:
          description: Filter results to controls linked to requirements of this framework id. Omit to return controls across all frameworks.
          example: 1
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        description: Filter results to controls linked to requirements of this framework id. Omit to return controls across all frameworks.
      - in: query
        name: status
        schema:
          description: 'Filter results to only controls with this status. Accepted values: ready, not_ready, not_applicable, not_started. Omit to return controls in any state.'
          example: ready
          type: string
          enum:
          - ready
          - not_ready
          - not_applicable
          - not_started
        description: 'Filter results to only controls with this status. Accepted values: ready, not_ready, not_applicable, not_started. Omit to return controls in any state.'
      - in: query
        name: offset
        schema:
          description: Number of items to skip before collecting results. Use with limit to page through results. Defaults to 0.
          example: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        description: Number of items to skip before collecting results. Use with limit to page through results. Defaults to 0.
      - in: query
        name: limit
        schema:
          description: Maximum number of items to return in a single response. Minimum 1, maximum 100. Defaults to 25.
          example: 25
          type: integer
          minimum: 1
          maximum: 100
        description: Maximum number of items to return in a single response. Minimum 1, maximum 100. Defaults to 25.
      responses:
        '200':
          description: Successful retrieval of compliance controls.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          exclusiveMinimum: 0
                          maximum: 9007199254740991
                          description: The unique numeric identifier of the control.
                          example: 1
                        code:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: The human-readable control code. Qualio-managed controls are prefixed with QMC (for example QMC-1); controls created by your organisation are prefixed with C (for example C-15). null when the control has no assigned code.
                          example: QMC-1
                        name:
                          type: string
                          description: The display name of the control.
                          example: Access Control Policy
                        description:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: An optional human-readable description of the control.
                          example: Restricts system access to authorised users.
                        category:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: An optional category used to group related controls.
                          example: Information Security
                        status:
                          anyOf:
                          - type: string
                            enum:
                            - ready
                            - not_ready
                            - not_applicable
                            - not_started
                          - type: 'null'
                          description: 'The current implementation status of the control. ready: the control is implemented and effective. not_ready: the control is in progress. not_applicable: the control does not apply to this instance. not_started: work on the control has not begun. null when no status has been determined.'
                          example: ready
                      required:
                      - id
                      - code
                      - name
                      - description
                      - category
                      - status
                      additionalProperties: false
                  total:
                    type: number
                required:
                - items
                - total
                additionalProperties: false
                description: A paginated list of compliance controls.
                example:
                  total: 2
                  items:
                  - id: 1
                    code: QMC-1
                    name: Access Control Policy
                    description: Restricts system access to authorised users.
                    category: Information Security
                    status: ready
                  - id: 2
                    code: C-15
                    name: Data Backup
                    description: null
                    category: null
                    status: not_started
                ref: complianceControlListResponse
        '400':
          description: The request has malformed query parameters
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/genericBadRequest400ParametersResponse'
        '403':
          description: This API key is not allowed to perform this action, or the API key is incorrect
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/genericForbiddenResponse'
        '429':
          description: This API key has exceeded the fair usage policy in Qualio, and has it its requests restricted. This request has not been processed
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Content-Type:
              schema:
