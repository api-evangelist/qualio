  /v1/compliance/requirements/{requirementId}/status:
    patch:
      summary: Update a requirement status
      description: "Updates the assessment status of a compliance requirement for your Qualio instance. The status reflects the current compliance posture for the requirement: not_started (assessment has not begun), in_progress (assessment is underway), met (the requirement is satisfied), attention_required (the requirement needs attention), or not_applicable (the requirement does not apply â\x80\x94 a justification is required). A justification must be provided when setting the status to not_applicable."
      operationId: updateComplianceRequirementStatus
      tags:
      - Compliance Intelligence
      security:
      - api_key: []
      parameters:
      - in: path
        name: requirementId
        schema:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: The numeric id of the compliance requirement.
          example: 101
        required: true
        description: The numeric id of the compliance requirement.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - not_started
                  - in_progress
                  - met
                  - attention_required
                  - not_applicable
                  description: "The new assessment status for the requirement. not_started: assessment has not begun. in_progress: assessment is underway. met: the requirement is satisfied. attention_required: the requirement needs attention. not_applicable: the requirement does not apply â\x80\x94 justification is required."
                  example: met
                justification:
                  description: Required when status is not_applicable. Explains why the requirement does not apply to this instance.
                  example: Exempt under clause 1.2
                  type: string
              required:
              - status
              description: The new status to apply to the requirement.
              example:
                status: met
              ref: updateComplianceRequirementStatusRequest
      responses:
        '200':
          description: Requirement status updated successfully.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  requirement_id:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                    description: The id of the requirement whose status was updated.
                    example: 101
                  status:
                    type: string
                    enum:
                    - not_started
                    - in_progress
                    - met
                    - attention_required
                    - not_applicable
                    description: The current assessment status of the requirement.
                    example: met
                  justification:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: The justification provided when status is not_applicable. null for all other statuses.
                    example: null
                required:
                - requirement_id
                - status
                - justification
                additionalProperties: false
                description: The updated requirement status.
                example:
                  requirement_id: 101
                  status: met
                  justification: null
                ref: complianceRequirementStatus
        '400':
          description: The request has malformed path parameters
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
