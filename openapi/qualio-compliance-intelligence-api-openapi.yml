  /v1/compliance/requirements:
    get:
      summary: List requirements
      description: Lists the compliance requirements in your Qualio instance. A requirement is an individual clause or control obligation from a compliance framework that your organisation has committed to meet. Each requirement belongs to exactly one framework and carries a requirement_number (for example a clause reference such as 7.1), a short name, and optional full normative text. Use the framework_id parameter to return requirements for a specific framework only. Omit it to return requirements across all frameworks visible to your instance. Results are ordered by requirement id. Use offset and limit to page through large sets; the total field in the response reports the full count before pagination is applied.
      operationId: listComplianceRequirements
      tags:
      - Compliance Intelligence
      security:
      - api_key: []
      parameters:
      - in: query
        name: framework_id
        schema:
          description: Filter results to requirements belonging to this framework id. Omit to return requirements across all frameworks.
          example: 1
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        description: Filter results to requirements belonging to this framework id. Omit to return requirements across all frameworks.
      - in: query
        name: offset
        schema:
          description: Number of items to skip before collecting results. Use with limit to page through results. Defaults to 0.
          example: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        description: Number of items to skip before collecting results. Use with limit to page through results. Defaults to 0.
      - in: query
        name: limit
        schema:
          description: Maximum number of items to return in a single response. Minimum 1, maximum 100. Defaults to 25.
