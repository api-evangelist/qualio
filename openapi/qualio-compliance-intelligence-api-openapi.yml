              ref: updateComplianceGapRequest
      responses:
        '200':
          description: Gap updated successfully.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                    description: The unique numeric identifier of the gap.
                    example: 500
                  control_id:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                    description: The id of the control this gap was raised against.
                    example: 1
                  summary:
                    type: string
                    description: A short summary of the gap.
                    example: Missing objective evidence
                  description:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: A fuller description of the gap. null when none is available.
                    example: The control has no objective evidence demonstrating it is operating.
                  recommendation:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: A recommended action to resolve the gap. null when none is available.
                    example: Attach objective evidence to the control.
                  severity:
                    type: string
                    enum:
                    - high
                    - medium
                    - low
                    description: 'The severity of the gap. high: significant compliance risk. medium: moderate risk. low: minor risk.'
                    example: high
                  status:
                    type: string
                    enum:
                    - open
                    - resolved
                    - dismissed
                    description: 'The current status of the gap. open: the gap is outstanding. resolved: the gap has been addressed. dismissed: the gap was reviewed and set aside.'
                    example: open
                  created_at:
                    type: string
                    format: date-time
                    description: The time the gap was created, as an ISO 8601 timestamp.
                    example: '2026-01-01T12:00:00Z'
                  updated_at:
                    type: string
                    format: date-time
                    description: The time the gap was last updated, as an ISO 8601 timestamp.
                    example: '2026-01-02T12:00:00Z'
                required:
                - id
                - control_id
                - summary
                - description
                - recommendation
                - severity
                - status
                - created_at
                - updated_at
                additionalProperties: false
                description: The updated gap.
                example:
                  id: 500
                  control_id: 1
                  summary: Missing objective evidence
                  description: The control has no objective evidence demonstrating it is operating.
                  recommendation: Attach objective evidence to the control.
                  severity: medium
                  status: resolved
                  created_at: '2026-01-01T12:00:00Z'
                  updated_at: '2026-01-03T12:00:00Z'
                ref: updatedComplianceGap
        '400':
          description: The request has malformed path parameters
